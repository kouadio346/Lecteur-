name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier l'environnement Java
        shell: bash
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{if ($1 == 1) print $2; else print $1}')
          if [ -z "${JAVA_MAJOR}" ] || [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Erreur : Java 17 ou une version plus récente est requise (version détectée : ${JAVA_MAJOR:-inconnue})."
            exit 1
          fi
          echo "Java ${JAVA_MAJOR} détecté."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Créer un magasin de clés de débogage temporaire
        shell: bash
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              KEYTOOL_BIN="keytool"
            fi
            if ! "${KEYTOOL_BIN}" -genkeypair -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "Erreur : Impossible de générer ./debug.keystore."
              exit 1
            fi
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Erreur : ./debug.keystore est manquant après génération."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        shell: bash
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Erreur : ${EXPECTED_APK} est introuvable."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Fichiers APK détectés dans app/build/outputs/apk :"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Le répertoire app/build/outputs/apk n'existe pas."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
